# CI — Turnu Măgurele Civic (Faza 5.1, pasul 5.1.7)
# Matricea G5 / B10 §2: Node 20 + 24 × MySQL 8.0 + 8.4.
# În plus, din 07.10.2026 (amendamentul la G2): Node 24 × MariaDB 11.4, baza de date a găzduirii de producție.
# DEC-8 (c1): un job fixat pe versiunile exacte de producție (Node 24.22.2, MariaDB 11.4.13; cPanel, 04.11.2026; Node actualizat de furnizor de la 24.21.0, constatat la 03.11.2026).
# La o schimbare de versiune pe server, valorile node / image / expect_* de mai jos se actualizează împreună.
# Etape: lint (tsc) → build (frontend + artefactul backend) → unitare → API → integrare DB → artefact → E2E.
# Orice eșec blochează integrarea (B-2).
#
# Repository public: jurnalele CI sunt publice. Aici nu există secrete reale; parolele MySQL de mai jos
# sunt de unică folosință, pentru containerele de test, iar secretele aplicației se generează la fiecare rulare.

name: CI

on:
  push:
    branches: [faza-5-backend]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Node ${{ matrix.node }}, ${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
        db: ['MySQL 8.0', 'MySQL 8.4']
        include:
          - db: 'MySQL 8.0'
            image: 'mysql:8.0'
            health: 'mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only'
          - db: 'MySQL 8.4'
            image: 'mysql:8.4'
            health: 'mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only'
          # imaginea MariaDB acceptă aceleași variabile MYSQL_*; clientul ei se numește `mariadb-admin`
          - node: '24'
            db: 'MariaDB 11.4'
            image: 'mariadb:11.4'
            health: 'mariadb-admin ping -h 127.0.0.1 -uroot -pci_root_only'
          # DEC-8 (c1): versiunile exacte de producție; jobul verifică explicit că rulează pe ele
          - node: '24.22.2'
            db: 'MariaDB 11.4.13, producție'
            image: 'mariadb:11.4.13'
            health: 'mariadb-admin ping -h 127.0.0.1 -uroot -pci_root_only'
            expect_node: '24.22.2'
            expect_db: '11.4.13'
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: civic_test
          MYSQL_USER: civic
          MYSQL_PASSWORD: ci_civic_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CIVIC_TEST_DATABASE_URL: mysql://civic:ci_civic_only@127.0.0.1:3306/civic_test
      # V3: a doua bază, cu alt utilizator, ținta testelor `restore-target:*` (creată mai jos, pasul „DB țintă pentru V3”)
      CIVIC_TEST_TARGET_DATABASE_URL: mysql://civic_tgt:ci_target_only@127.0.0.1:3306/civic_test_target
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Versiuni
        run: |
          node --version
          npm --version
          mysql -h 127.0.0.1 -uroot -pci_root_only -N -e "SELECT VERSION()"

      # DEC-8 (c1): numai în jobul de producție; oprește jobul dacă versiunile nu sunt exact cele cerute
      - name: Versiunile exacte de producție
        if: ${{ matrix.expect_node }}
        run: |
          n="$(node --version)"
          test "$n" = "v${{ matrix.expect_node }}" || { echo "Node: $n; așteptat: v${{ matrix.expect_node }}"; exit 1; }
          v="$(mysql -h 127.0.0.1 -uroot -pci_root_only -N -e 'SELECT VERSION()')"
          case "$v" in
            "${{ matrix.expect_db }}-MariaDB"*) ;;
            *) echo "Baza de date: $v; așteptat: ${{ matrix.expect_db }}-MariaDB…"; exit 1 ;;
          esac
          echo "Node $n; baza de date $v"
          # amprenta imaginii folosite, numai pentru trasabilitate (eticheta poate fi reconstruită de mainteneri);
          # o amprentă absentă sau cu alt format se raportează explicit și nu se prezintă drept amprentă validă
          d="$(docker image inspect --format '{{join .RepoDigests " "}}' "${{ matrix.image }}" 2>/dev/null || true)"
          digest=""
          for x in $d; do
            if [[ "$x" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then digest="$x"; break; fi
          done
          if [ -n "$digest" ]; then
            echo "Amprenta imaginii: $digest"
          else
            echo "::warning title=Amprenta imaginii indisponibilă::RepoDigests pentru ${{ matrix.image }} este gol sau fără o amprentă sha256 validă ('${d}'). Versiunile au fost totuși verificate mai sus."
          fi

      # E4.11 (planul r3.2 §7.1–§7.2): instrumentele testelor de interoperabilitate și ale testului strace.
      # Orice eșec (descărcare, amprentă, versiune) oprește jobul: testele nu se omit niciodată.
      # rage: implementarea independentă (Rust) a formatului age, din versiunea oficială publicată de autor pe GitHub
      # (str4d/rage, v0.12.1, 14.07.2026). Amprenta SHA-256 de mai jos este a arhivei oficiale; la o schimbare de
      # versiune, RAGE_VERSION și RAGE_SHA256 se actualizează împreună, printr-o modificare aprobată.
      # age: implementarea oficială (Go), din pachetul Ubuntu 24.04; versiunea se verifică exact (AGE_VERSION), ca
      # rezultatele să fie reproductibile; o altă versiune oprește jobul până la o actualizare aprobată.
      - name: E4.11 — age, strace (apt), rage (versiune fixată, amprentă verificată), vectorii CCTV (commit fixat)
        env:
          AGE_VERSION: '1.1.1'
          RAGE_VERSION: '0.12.1'
          RAGE_SHA256: 'c5d7ab41fbf1213590e89721fd2b8eb122e84518c155ce35866f1c5759a3a29f'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q age strace
          test "$(age --version)" = "${AGE_VERSION}" || { echo "age: $(age --version); așteptat: ${AGE_VERSION}"; exit 1; }
          echo "age $(age --version)"
          strace -V | head -1
          f="$RUNNER_TEMP/rage.tar.gz"
          curl -fsSL --retry 3 -o "$f" "https://github.com/str4d/rage/releases/download/v${RAGE_VERSION}/rage-v${RAGE_VERSION}-x86_64-linux.tar.gz"
          echo "${RAGE_SHA256}  $f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rage"
          tar -xzf "$f" -C "$RUNNER_TEMP/rage"
          test "$("$RUNNER_TEMP/rage/rage/rage" --version)" = "rage ${RAGE_VERSION}"
          echo "CIVIC_RAGE_BIN=$RUNNER_TEMP/rage/rage/rage" >> "$GITHUB_ENV"
          # vectorii publici C2SP CCTV/age (147), la commitul fixat; git verifică singur conținutul prin commit
          CCTV_COMMIT='50a8ecf2a220f4c8bdc4f085789b8e85c26829e7'
          git init -q "$RUNNER_TEMP/cctv"
          git -C "$RUNNER_TEMP/cctv" fetch -q --depth 1 https://github.com/C2SP/CCTV.git "$CCTV_COMMIT"
          git -C "$RUNNER_TEMP/cctv" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cctv" rev-parse HEAD)" = "$CCTV_COMMIT"
          test "$(find "$RUNNER_TEMP/cctv/age/testdata" -maxdepth 1 -type f | wc -l)" -eq 147
          echo "CIVIC_CCTV_DIR=$RUNNER_TEMP/cctv/age/testdata" >> "$GITHUB_ENV"

      - name: npm ci
        run: npm ci

      - name: Lint (tsc) — frontend
        run: npx tsc --noEmit

      - name: Lint (tsc) — server, shared
        run: npm run typecheck --workspaces

      - name: Build frontend
        run: npm run build

      - name: Build artefact backend
        run: npm run build -w server

      # Notele de licență (propunerea „corectura notelor de licență” r2, 06.11.2026): ambele construcții le generează
      # din graful real al modulelor și eșuează la un pachet fără licență acceptată; aici, controlul conținutului.
      - name: Notele de licență ale codului terț (frontend și server)
        run: |
          for f in dist/THIRD_PARTY_LICENSES.txt server/dist/THIRD_PARTY_LICENSES.txt; do
            test -s "$f"
            n=$(sed -n 's/^Pachete terțe incluse: \([0-9]*\)$/\1/p' "$f")
            s=$(grep -c '^Licența declarată: ' "$f")
            echo "$f: $n pachete, $s secțiuni"
            test "$n" -gt 0
            test "$n" = "$s"
          done
          # frontendul: exact pachetele din inventarul propunerii (r2, §1.2); o schimbare de dependențe cere actualizarea listei
          fe=$(sed -n '/^Cuprins:$/,/^$/p' dist/THIRD_PARTY_LICENSES.txt | sed -n 's/^  \(.*\)@[^@ ]*  (.*)$/\1/p' | sort | tr '\n' ' ')
          echo "frontend: $fe"
          test "$fe" = "altcha-lib dijkstrajs leaflet lucide-react qrcode react react-dom scheduler zod "
          grep -q '^  age-encryption@' server/dist/THIRD_PARTY_LICENSES.txt
          grep -q '^  abstract-logging@2.0.1  (MIT)' server/dist/THIRD_PARTY_LICENSES.txt
          grep -q '^  drizzle-orm@0.45.3  (Apache-2.0)' server/dist/THIRD_PARTY_LICENSES.txt
          grep -q 'Copyright © 2026 James Sumners' server/dist/THIRD_PARTY_LICENSES.txt

      - name: Teste unitare
        run: npm run test:unit -w server

      - name: Teste API
        run: npm run test:api -w server

      # V3 (propunerea r4, 05.11.2026): ținta restaurării de probă este o bază DISTINCTĂ, cu utilizatorul ei, cu drepturi
      # numai pe ea (ca baza de test de pe găzduire); fără ea, testul de integrare V3 eșuează în CI (nu se omite).
      - name: DB țintă pentru V3
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root_only -e "CREATE DATABASE civic_test_target CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE USER 'civic_tgt'@'%' IDENTIFIED BY 'ci_target_only'; GRANT ALL ON civic_test_target.* TO 'civic_tgt'@'%';"

      - name: Teste de integrare (${{ matrix.db }})
        run: npm run test:integration -w server

      - name: Artefactul (server/dist/app.js) — migrate, seed, pornire, health
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root_only -e "DROP DATABASE civic_test; CREATE DATABASE civic_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL ON civic_test.* TO 'civic'@'%';"
          gen() { node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"; }
          {
            echo "APP_ENV=development"
            echo "PORT=3900"
            echo "PUBLIC_BASE_URL=http://localhost:3900"
            echo "DATABASE_URL=$CIVIC_TEST_DATABASE_URL"
            echo "STORAGE_DIR=$RUNNER_TEMP/storage"
            echo "IP_HASH_SECRET=$(gen)"
            echo "PARTICIPATION_HMAC_SECRET=$(gen)"
            echo "FORM_TOKEN_SECRET=$(gen)"
            echo "POW_HMAC_KEY=$(gen)"
            echo "TOTP_ENC_KEY=$(gen)"
          } > "$RUNNER_TEMP/civic.env"
          chmod 600 "$RUNNER_TEMP/civic.env"
          # artefactul rulează fără node_modules (ca pe hosting)
          mkdir -p "$RUNNER_TEMP/deploy/server"
          cp -r dist "$RUNNER_TEMP/deploy/dist"
          cp -r server/dist server/migrations server/seeds server/data "$RUNNER_TEMP/deploy/server/"
          cd "$RUNNER_TEMP/deploy"
          node --env-file="$RUNNER_TEMP/civic.env" server/dist/app.js migrate
          node --env-file="$RUNNER_TEMP/civic.env" server/dist/app.js migrate
          node --env-file="$RUNNER_TEMP/civic.env" server/dist/app.js seed:config
          node --env-file="$RUNNER_TEMP/civic.env" server/dist/app.js seed:demo
          # ca pe staging: setările din fișierul numit de CIVIC_ENV_FILE (decizia tehnică 5.1-A)
          CIVIC_ENV_FILE="$RUNNER_TEMP/civic.env" node server/dist/app.js migrate:status
          # V3: comenzile țintei sunt în artefact și citesc `restore-target.env` de lângă fișierul de setări activ;
          # fără o copie decriptată în BACKUP_DIR, `status` raportează ținta (fără parolă) și iese cu 1; nimic scris.
          # Directorul țintă stă în afara directorului cu fișierul de setări (protecția din restoreTarget.ts îl refuză acolo).
          mkdir -p "$RUNNER_TEMP/v3/backups"
          { cat "$RUNNER_TEMP/civic.env"; echo "BACKUP_DIR=$RUNNER_TEMP/v3/backups"; } > "$RUNNER_TEMP/v3/civic.env"
          printf 'DATABASE_URL=%s\nSTORAGE_DIR=%s\n' "$CIVIC_TEST_TARGET_DATABASE_URL" "$RUNNER_TEMP/v3-storage" > "$RUNNER_TEMP/v3/restore-target.env"
          chmod 600 "$RUNNER_TEMP/v3/civic.env" "$RUNNER_TEMP/v3/restore-target.env"
          set +e
          v3out="$(CIVIC_ENV_FILE="$RUNNER_TEMP/v3/civic.env" node server/dist/app.js restore-target:status 2>&1)"
          v3rc=$?
          set -e
          echo "$v3out"
          test "$v3rc" = 1
          echo "$v3out" | grep -q 'parola nu se afișează'
          echo "$v3out" | grep -q 'nu există nicio copie decriptată'
          if echo "$v3out" | grep -q 'ci_target_only'; then echo "ieșirea conține parola țintei"; exit 1; fi
          test ! -e "$RUNNER_TEMP/v3-storage"
          CIVIC_ENV_FILE="$RUNNER_TEMP/civic.env" node server/dist/app.js > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3900/api/v1/health && break; sleep 1; done
          echo
          test "$(curl -s http://127.0.0.1:3900/api/v1/health | node -pe 'JSON.parse(require("fs").readFileSync(0)).status')" = ok
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3900/)" = 200
          # 7C, P5 (DEC-2): fără SEARCH_INDEXING, noindex pe HTML, pe un fișier static și pe API; robots.txt exact
          noindex() {
            v="$(curl -s -o /dev/null -D - "http://127.0.0.1:3900$1" | tr -d '\r' | awk -F': ' 'tolower($1) == "x-robots-tag" { print $2 }')"
            test "$v" = "noindex, nofollow" || { echo "X-Robots-Tag greșit pe $1: '$v'"; exit 1; }
          }
          noindex /
          noindex /favicon.svg
          noindex /api/v1/health
          curl -s http://127.0.0.1:3900/robots.txt | cmp - <(printf 'User-agent: *\nDisallow: /\n')
          kill "$SERVER_PID"

  e2e:
    name: E2E — suita existentă (Python + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 5.2: testele UI cu autentificare pornesc serverul Node pe un DB de test (tests/lib/harness.py, backend_server)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: civic_test
          MYSQL_USER: civic
          MYSQL_PASSWORD: ci_civic_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CIVIC_TEST_DATABASE_URL: mysql://civic:ci_civic_only@127.0.0.1:3306/civic_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: npm ci
        run: npm ci

      - name: Playwright (Chromium)
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      # run_all.py iese cu 0 numai fără FAIL-uri noi; P7 (R6D-SES-01) închis formal la 5.2.9, nu mai e FAIL cunoscut
      - name: Suita existentă (tests/run_all.py)
        run: python tests/run_all.py
