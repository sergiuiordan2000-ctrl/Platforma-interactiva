# CI — Turnu Măgurele Civic (Faza 5.1, pasul 5.1.7)
# Matricea G5 / B10 §2: Node 20 + 24 × MySQL 8.0 + 8.4.
# În plus, din 07.10.2026 (amendamentul la G2): Node 24 × MariaDB 11.4, baza de date a găzduirii de producție.
# DEC-8 (c1): un job fixat pe versiunile exacte de producție (Node 24.21.0, MariaDB 11.4.13; cPanel, 07.10.2026).
# La o schimbare de versiune pe server, valorile node / image / expect_* de mai jos se actualizează împreună.
# Etape: lint (tsc) → build (frontend + artefactul backend) → unitare → API → integrare DB → artefact → E2E.
# Orice eșec blochează integrarea (B-2).
#
# Repository public: jurnalele CI sunt publice. Aici nu există secrete reale; parolele MySQL de mai jos
# sunt de unică folosință, pentru containerele de test, iar secretele aplicației se generează la fiecare rulare.

name: CI

on:
  push:
    branches: [faza-5-backend]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Node ${{ matrix.node }}, ${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
        db: ['MySQL 8.0', 'MySQL 8.4']
        include:
          - db: 'MySQL 8.0'
            image: 'mysql:8.0'
            health: 'mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only'
          - db: 'MySQL 8.4'
            image: 'mysql:8.4'
            health: 'mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only'
          # imaginea MariaDB acceptă aceleași variabile MYSQL_*; clientul ei se numește `mariadb-admin`
          - node: '24'
            db: 'MariaDB 11.4'
            image: 'mariadb:11.4'
            health: 'mariadb-admin ping -h 127.0.0.1 -uroot -pci_root_only'
          # DEC-8 (c1): versiunile exacte de producție; jobul verifică explicit că rulează pe ele
          - node: '24.21.0'
            db: 'MariaDB 11.4.13, producție'
            image: 'mariadb:11.4.13'
            health: 'mariadb-admin ping -h 127.0.0.1 -uroot -pci_root_only'
            expect_node: '24.21.0'
            expect_db: '11.4.13'
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: civic_test
          MYSQL_USER: civic
          MYSQL_PASSWORD: ci_civic_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CIVIC_TEST_DATABASE_URL: mysql://civic:ci_civic_only@127.0.0.1:3306/civic_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Versiuni
        run: |
          node --version
          npm --version
          mysql -h 127.0.0.1 -uroot -pci_root_only -N -e "SELECT VERSION()"

      # DEC-8 (c1): numai în jobul de producție; oprește jobul dacă versiunile nu sunt exact cele cerute
      - name: Versiunile exacte de producție
        if: ${{ matrix.expect_node }}
        run: |
          n="$(node --version)"
          test "$n" = "v${{ matrix.expect_node }}" || { echo "Node: $n; așteptat: v${{ matrix.expect_node }}"; exit 1; }
          v="$(mysql -h 127.0.0.1 -uroot -pci_root_only -N -e 'SELECT VERSION()')"
          case "$v" in
            "${{ matrix.expect_db }}-MariaDB"*) ;;
            *) echo "Baza de date: $v; așteptat: ${{ matrix.expect_db }}-MariaDB…"; exit 1 ;;
          esac
          echo "Node $n; baza de date $v"
          # amprenta imaginii folosite, numai pentru trasabilitate (eticheta poate fi reconstruită de mainteneri);
          # o amprentă absentă sau cu alt format se raportează explicit și nu se prezintă drept amprentă validă
          d="$(docker image inspect --format '{{join .RepoDigests " "}}' "${{ matrix.image }}" 2>/dev/null || true)"
          digest=""
          for x in $d; do
            if [[ "$x" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then digest="$x"; break; fi
          done
          if [ -n "$digest" ]; then
            echo "Amprenta imaginii: $digest"
          else
            echo "::warning title=Amprenta imaginii indisponibilă::RepoDigests pentru ${{ matrix.image }} este gol sau fără o amprentă sha256 validă ('${d}'). Versiunile au fost totuși verificate mai sus."
          fi

      - name: npm ci
        run: npm ci

      - name: Lint (tsc) — frontend
        run: npx tsc --noEmit

      - name: Lint (tsc) — server, shared
        run: npm run typecheck --workspaces

      - name: Build frontend
        run: npm run build

      - name: Build artefact backend
        run: npm run build -w server

      - name: Teste unitare
        run: npm run test:unit -w server

      - name: Teste API
        run: npm run test:api -w server

      - name: Teste de integrare (${{ matrix.db }})
        run: npm run test:integration -w server

      - name: Artefactul (server/dist/app.js) — migrate, seed, pornire, health
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root_only -e "DROP DATABASE civic_test; CREATE DATABASE civic_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL ON civic_test.* TO 'civic'@'%';"
          gen() { node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"; }
          {
            echo "APP_ENV=development"
            echo "PORT=3900"
            echo "PUBLIC_BASE_URL=http://localhost:3900"
            echo "DATABASE_URL=$CIVIC_TEST_DATABASE_URL"
            echo "STORAGE_DIR=$RUNNER_TEMP/storage"
            echo "IP_HASH_SECRET=$(gen)"
            echo "PARTICIPATION_HMAC_SECRET=$(gen)"
            echo "FORM_TOKEN_SECRET=$(gen)"
            echo "POW_HMAC_KEY=$(gen)"
            echo "TOTP_ENC_KEY=$(gen)"
          } > "$RUNNER_TEMP/civic.env"
          chmod 600 "$RUNNER_TEMP/civic.env"
          # artefactul rulează fără node_modules (ca pe hosting)
          mkdir -p "$RUNNER_TEMP/deploy/server"
          cp -r dist "$RUNNER_TEMP/deploy/dist"
          cp -r server/dist server/migrations server/seeds server/data "$RUNNER_TEMP/deploy/server/"
          cd "$RUNNER_TEMP/deploy"
          node --env-file="$RUNNER_TEMP/civic.env" server/dist/app.js migrate
          node --env-file="$RUNNER_TEMP/civic.env" server/dist/app.js migrate
          node --env-file="$RUNNER_TEMP/civic.env" server/dist/app.js seed:config
          node --env-file="$RUNNER_TEMP/civic.env" server/dist/app.js seed:demo
          # ca pe staging: setările din fișierul numit de CIVIC_ENV_FILE (decizia tehnică 5.1-A)
          CIVIC_ENV_FILE="$RUNNER_TEMP/civic.env" node server/dist/app.js migrate:status
          CIVIC_ENV_FILE="$RUNNER_TEMP/civic.env" node server/dist/app.js > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3900/api/v1/health && break; sleep 1; done
          echo
          test "$(curl -s http://127.0.0.1:3900/api/v1/health | node -pe 'JSON.parse(require("fs").readFileSync(0)).status')" = ok
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3900/)" = 200
          # 7C, P5 (DEC-2): fără SEARCH_INDEXING, noindex pe HTML, pe un fișier static și pe API; robots.txt exact
          noindex() {
            v="$(curl -s -o /dev/null -D - "http://127.0.0.1:3900$1" | tr -d '\r' | awk -F': ' 'tolower($1) == "x-robots-tag" { print $2 }')"
            test "$v" = "noindex, nofollow" || { echo "X-Robots-Tag greșit pe $1: '$v'"; exit 1; }
          }
          noindex /
          noindex /favicon.svg
          noindex /api/v1/health
          curl -s http://127.0.0.1:3900/robots.txt | cmp - <(printf 'User-agent: *\nDisallow: /\n')
          kill "$SERVER_PID"

  e2e:
    name: E2E — suita existentă (Python + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 5.2: testele UI cu autentificare pornesc serverul Node pe un DB de test (tests/lib/harness.py, backend_server)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: civic_test
          MYSQL_USER: civic
          MYSQL_PASSWORD: ci_civic_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CIVIC_TEST_DATABASE_URL: mysql://civic:ci_civic_only@127.0.0.1:3306/civic_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: npm ci
        run: npm ci

      - name: Playwright (Chromium)
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      # run_all.py iese cu 0 numai fără FAIL-uri noi; P7 (R6D-SES-01) închis formal la 5.2.9, nu mai e FAIL cunoscut
      - name: Suita existentă (tests/run_all.py)
        run: python tests/run_all.py
